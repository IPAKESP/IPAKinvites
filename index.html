<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPAK Dawat 2026 - Invite Generator</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f3f4f6; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-wrap: wrap;
            gap: 20px; 
        }
        
        .controls { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            width: 320px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            height: fit-content;
        }
        
        .preview-container { 
            background: #e5e7eb; 
            padding: 20px; 
            border-radius: 8px; 
            flex-grow: 1; 
            display: flex; 
            justify-content: center; 
            /* Hide scrollbars during the split-second download scale */
            overflow: hidden; 
            min-width: 300px;
            height: 800px; /* fixed height taa k layout na hilay */
        }
        
        h2 { color: #15803d; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px;}
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 15px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            color: white; 
            font-size: 16px;
        }
        .btn-download { background: #2563eb; }
        .btn-download:hover { background: #1d4ed8; }
        .btn-whatsapp { background: #16a34a; }
        .btn-whatsapp:hover { background: #15803d; }
        
        /* TRUE 4K SETUP */
        .preview-wrapper { 
            width: 4096px; 
            height: 4096px; 
            transform-origin: top left; 
            /* Screen par fit karne k liye scale */
            transform: scale(0.18); 
        }

        #invite-preview {
            width: 4096px; 
            height: 4096px;
            background-image: url('background.jpg');
            background-size: cover; 
            position: relative; 
            background-color: white;
            text-rendering: optimizeLegibility;
        }

        /* Fonts multiplied by 4 to match 4096 resolution */
        #dynamic-name { 
            position: absolute; 
            top: 15%; 
            left: 12.2%; 
            font-size: 120px; 
            font-weight: bold; 
            color: black; 
        }
        
        #dynamic-sender-box { 
            position: absolute; 
            top: 61.5%; 
            left: 12.2%; 
            color: black; 
            line-height: 1.2;
        }
        
        .sender-name { font-size: 120px; font-weight: bold; margin-bottom: 20px; }
        .sender-title { font-size: 80px; font-weight: normal; }
        .sender-company { font-size: 160px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="controls">
        <h2>IPAK Invites</h2>
        
        <label>Guest Name</label>
        <input type="text" id="guestName" placeholder="e.g. Mr. Syed Athar Bukhari" onkeyup="updatePreview()">

        <label>Send On Behalf Of</label>
        <select id="senderSelect" onchange="updatePreview()">
            <option value="ceo">Naveed Godil</option>
            <option value="cco">Khalid Mehmood</option>
        </select>

        <label>Guest WhatsApp Number</label>
        <input type="text" id="whatsappNumber" placeholder="e.g. 923001234567">
        <small style="color: #6b7280; display: block; margin-top: 4px;">Country code k sath (maslan 923...)</small>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

        <button onclick="downloadInvite()" class="btn-download">Download Invite</button>
        <button onclick="sendWhatsApp()" class="btn-whatsapp">Send via WhatsApp</button>
    </div>

    <div class="preview-container">
        <div class="preview-wrapper" id="p-wrapper">
            <div id="invite-preview">
                <div id="dynamic-name">Mr. Syed Athar Bukhari</div>
                <div id="dynamic-sender-box">
                    <div id="dynamic-sender-name" class="sender-name">Naveed Godil</div>
                    <div id="dynamic-sender-title" class="sender-title">Chief Executive Officer</div>
                    <div class="sender-company"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const senders = {
            ceo: { name: "Naveed Godil", title: "Chief Executive Officer" },
            cco: { name: "Khalid Mehmood", title: "Chief Commercial Officer" }
        };

        function updatePreview() {
            const nameInput = document.getElementById('guestName').value;
            const senderSelect = document.getElementById('senderSelect').value;

            document.getElementById('dynamic-name').innerText = nameInput ? nameInput : "Guest Name Here";
            document.getElementById('dynamic-sender-name').innerText = senders[senderSelect].name;
            document.getElementById('dynamic-sender-title').innerText = senders[senderSelect].title;
        }

        function downloadInvite() {
            const wrapper = document.getElementById('p-wrapper');
            const previewElement = document.getElementById('invite-preview');
            const guestName = document.getElementById('guestName').value || 'Guest';
            
            // Temporary scale removal so tool captures the raw 4096x4096 resolution
            wrapper.style.transform = 'scale(1)';
            
            html2canvas(previewElement, { 
                scale: 1, // original 1:1 scale
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `IPAK_Dawat_2026_${guestName.replace(/\s+/g, '_')}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();
                
                // Return to screen scale
                wrapper.style.transform = 'scale(0.18)';
            });
        }

        function sendWhatsApp() {
            const guestName = document.getElementById('guestName').value || 'Guest';
            const phone = document.getElementById('whatsappNumber').value;
            
            const message = `Dear ${guestName},\n\nIt is our pleasure to invite you to an exclusive evening celebrating the relationships that inspire innovation, growth, and sustainable success at IPAK Dawat 2026.\n\nDate: 3rd September 2026\nVenue: IPAK SHEIKHUPURA PLANT\n\nPlease find your invitation attached. We look forward to hosting you!`;
            
            let whatsappUrl = phone 
                ? `https://wa.me/${phone}?text=${encodeURIComponent(message)}` 
                : `https://web.whatsapp.com/send?text=${encodeURIComponent(message)}`;

            window.open(whatsappUrl, '_blank');
        }

        updatePreview();
    </script>
</body>
</html>
