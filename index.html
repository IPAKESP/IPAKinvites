<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPAK Dawat 2026 - Invite Generator</title>
    
    <!-- Download tool -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f3f4f6; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column;
            gap: 20px; 
        }

        @media(min-width: 900px) {
            body {
                flex-direction: row;
                padding: 20px;
            }
        }
        
        .controls { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            height: fit-content;
        }
        
        .preview-container { 
            background: #e5e7eb; 
            padding: 20px; 
            border-radius: 8px; 
            flex-grow: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }
        
        h2 { color: #15803d; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px;}
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 15px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            color: white; 
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn-download { background: #2563eb; }
        .btn-download:hover { background: #1d4ed8; }
        .btn-download:disabled { background: #94a3b8; cursor: not-allowed; }
        
        /* Auto-sizing Wrapper */
        .preview-wrapper { 
            width: 100%; 
            max-width: 500px; 
            aspect-ratio: 1 / 1; 
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
        }

        /* Actual 1024x1024 Canvas */
        #invite-preview {
            width: 1024px; 
            height: 1024px;
            position: absolute; 
            top: 0;
            left: 0;
            background-color: #ffffff; 
            transform-origin: top left;
            overflow: hidden;
        }

        /* Naya Background Image Style */
        .bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; /* Sabse peechay */
        }

        .guest-name-text { 
            position: absolute; 
            top: 15%; 
            left: 12.2%; 
            font-size: 30px; 
            font-weight: bold; 
            color: black; 
            z-index: 10; /* Image ke upar */
        }
        
        .sender-box { 
            position: absolute; 
            top: 61.5%; 
            left: 12.2%; 
            color: black; 
            line-height: 1.2;
            z-index: 10; /* Image ke upar */
        }
        
        .sender-name-text { font-size: 30px; font-weight: bold; margin-bottom: 5px; }
        .sender-title-text { font-size: 20px; font-weight: normal; }
    </style>
</head>
<body>

    <div class="controls">
        <h2>IPAK Invites</h2>
        
        <label>Guest Name</label>
        <input type="text" id="guestName" placeholder="e.g. Mr. Syed Athar Bukhari" onkeyup="updatePreview()">

        <label>Send On Behalf Of</label>
        <select id="senderSelect" onchange="updatePreview()">
            <option value="ceo">Naveed Godil</option>
            <option value="cco">Khalid Mehmood</option>
        </select>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

        <button onclick="downloadInvite()" class="btn-download" id="downloadBtn">Download Invite</button>
    </div>

    <div class="preview-container">
        <div class="preview-wrapper" id="preview-wrapper">
            <div id="invite-preview">
                <!-- Background image ab img tag se aa rahi hai jo quality lose nahi karegi -->
                <img src="background.jpg" class="bg-img" alt="Background">
                
                <div class="guest-name-text" id="dynamic-name">Mr. Syed Athar Bukhari</div>
                <div class="sender-box">
                    <div class="sender-name-text" id="dynamic-sender-name">Naveed Godil</div>
                    <div class="sender-title-text" id="dynamic-sender-title">Chief Executive Officer</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const senders = {
            ceo: { name: "Naveed Godil", title: "Chief Executive Officer" },
            cco: { name: "Khalid Mehmood", title: "Chief Commercial Officer" }
        };

        function adjustScale() {
            const wrapper = document.getElementById('preview-wrapper');
            const preview = document.getElementById('invite-preview');
            
            if(wrapper && preview) {
                const scale = wrapper.clientWidth / 1024;
                preview.style.transform = `scale(${scale})`;
            }
        }

        window.addEventListener('resize', adjustScale);
        window.addEventListener('load', adjustScale);

        function updatePreview() {
            const nameInput = document.getElementById('guestName').value;
            const senderSelect = document.getElementById('senderSelect').value;

            document.getElementById('dynamic-name').innerText = nameInput ? nameInput : "Guest Name Here";
            document.getElementById('dynamic-sender-name').innerText = senders[senderSelect].name;
            document.getElementById('dynamic-sender-title').innerText = senders[senderSelect].title;
            
            adjustScale(); 
        }

        function downloadInvite() {
            const btn = document.getElementById('downloadBtn');
            btn.innerText = "Downloading...";
            btn.disabled = true;

            const guestName = document.getElementById('guestName').value || 'Guest';
            const original = document.getElementById('invite-preview');
            
            const clone = original.cloneNode(true);
            
            clone.style.transform = 'none'; 
            clone.style.width = '1024px';
            clone.style.height = '1024px';
            clone.style.position = 'absolute'; 
            clone.style.left = '-9999px'; 
            clone.style.top = '0';
            clone.style.boxShadow = 'none';
            
            document.body.appendChild(clone);
            
            html2canvas(clone, { 
                scale: 4, 
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `IPAK_Dawat_2026_${guestName.replace(/\s+/g, '_')}.jpg`;
                
                link.href = canvas.toDataURL('image/jpeg', 1.0); 
                link.click();
                
                document.body.removeChild(clone);
                btn.innerText = "Download Invite";
                btn.disabled = false;
            }).catch(err => {
                console.error("Download Error:", err);
                alert("Error: Download fail ho gaya.");
                document.body.removeChild(clone);
                btn.innerText = "Download Invite";
                btn.disabled = false;
            });
        }

        updatePreview();
    </script>
</body>
</html>
