<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPAK Dawat 2026 - Invite Generator</title>
    
    <!-- Download tool -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f3f4f6; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-wrap: wrap;
            gap: 20px; 
        }
        
        .controls { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            width: 320px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            height: fit-content;
        }
        
        .preview-container { 
            background: #e5e7eb; 
            padding: 20px; 
            border-radius: 8px; 
            flex-grow: 1; 
            display: flex; 
            justify-content: center; 
            overflow: hidden; 
            min-width: 300px;
        }
        
        h2 { color: #15803d; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px;}
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 15px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            color: white; 
            font-size: 16px;
        }
        .btn-download { background: #2563eb; }
        .btn-download:hover { background: #1d4ed8; }
        
        .preview-wrapper { 
            width: 1024px; 
            height: 1024px; 
            transform-origin: top center; 
            transform: scale(0.6); 
            margin-bottom: -400px; 
        }

        #invite-preview {
            width: 1024px; 
            height: 1024px;
            background-image: url('background.jpg');
            background-size: cover; 
            position: relative; 
            background-color: #ffffff; 
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
        }

        .guest-name-text { 
            position: absolute; 
            top: 15%; 
            left: 12.2%; 
            font-size: 30px; 
            font-weight: bold; 
            color: black; 
        }
        
        .sender-box { 
            position: absolute; 
            top: 61.5%; 
            left: 12.2%; 
            color: black; 
            line-height: 1.2;
        }
        
        .sender-name-text { font-size: 30px; font-weight: bold; margin-bottom: 5px; }
        .sender-title-text { font-size: 20px; font-weight: normal; }
    </style>
</head>
<body>

    <div class="controls">
        <h2>IPAK Invites</h2>
        
        <label>Guest Name</label>
        <input type="text" id="guestName" placeholder="e.g. Mr. Syed Athar Bukhari" onkeyup="updatePreview()">

        <label>Send On Behalf Of</label>
        <select id="senderSelect" onchange="updatePreview()">
            <option value="ceo">Naveed Godil</option>
            <option value="cco">Khalid Mehmood</option>
        </select>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

        <button onclick="downloadInvite()" class="btn-download">Download Invite</button>
    </div>

    <div class="preview-container">
        <div class="preview-wrapper">
            <div id="invite-preview">
                <div class="guest-name-text" id="dynamic-name">Mr. Syed Athar Bukhari</div>
                <div class="sender-box">
                    <div class="sender-name-text" id="dynamic-sender-name">Naveed Godil</div>
                    <div class="sender-title-text" id="dynamic-sender-title">Chief Executive Officer</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const senders = {
            ceo: { name: "Naveed Godil", title: "Chief Executive Officer" },
            cco: { name: "Khalid Mehmood", title: "Chief Commercial Officer" }
        };

        function updatePreview() {
            const nameInput = document.getElementById('guestName').value;
            const senderSelect = document.getElementById('senderSelect').value;

            document.getElementById('dynamic-name').innerText = nameInput ? nameInput : "Guest Name Here";
            document.getElementById('dynamic-sender-name').innerText = senders[senderSelect].name;
            document.getElementById('dynamic-sender-title').innerText = senders[senderSelect].title;
        }

        function downloadInvite() {
            const guestName = document.getElementById('guestName').value || 'Guest';
            
            const original = document.getElementById('invite-preview');
            const clone = original.cloneNode(true);
            
            clone.style.width = '4096px';
            clone.style.height = '4096px';
            clone.style.position = 'fixed'; 
            clone.style.left = '200vw'; 
            clone.style.top = '0';
            clone.style.zIndex = '-9999';
            clone.style.transform = 'none'; 
            clone.style.boxShadow = 'none'; 
            clone.style.backgroundColor = '#ffffff'; 
            
            clone.querySelector('.guest-name-text').style.fontSize = '120px';
            clone.querySelector('.sender-name-text').style.fontSize = '120px';
            clone.querySelector('.sender-name-text').style.marginBottom = '20px';
            clone.querySelector('.sender-title-text').style.fontSize = '80px';
            
            document.body.appendChild(clone);
            
            html2canvas(clone, { 
                scale: 1, 
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff', 
                scrollX: 0, 
                scrollY: 0  
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `IPAK_Dawat_2026_${guestName.replace(/\s+/g, '_')}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 1.0); 
                link.click();
                
                document.body.removeChild(clone);
            });
        }

        updatePreview();
    </script>
</body>
</html>
